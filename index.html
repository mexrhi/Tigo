<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aura Cinema UI</title>
    <style>
        :root {
            --bg: #07090e;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --subtext: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            overflow-x: hidden;
            height: 100vh;
        }

        /* Ambient Animated Backdrop */
        .ambient-bg {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15), transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.1), transparent 50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(80px);
            animation: pulseBg 12s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(-2%, 2%); }
        }

        /* PROFILE SELECTION SCREEN */
        #profileScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #profileScreen.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .profile-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .profile-grid {
            display: flex;
            gap: 30px;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .profile-card:hover, .profile-card:active {
            transform: scale(1.08);
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .profile-card:hover .avatar {
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .profile-name {
            margin-top: 14px;
            font-weight: 600;
            font-size: 16px;
            color: var(--subtext);
        }

        /* MAIN APP UI */
        #mainApp {
            position: relative;
            z-index: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #mainApp.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* WELCOME BANNER ANIMATION */
        .welcome-toast {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInWelcome 1s ease-out forwards;
        }

        /* HERO CARD */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 40px;
            background: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1200') center/cover;
            display: flex;
            align-items: flex-end;
            padding: 40px;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(7, 9, 14, 0.95) 10%, rgba(7, 9, 14, 0.3) 60%, transparent);
        }

        .hero-details {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .hero-title {
            font-size: 38px;
            font-weight: 800;
            margin: 0 0 10px 0;
            line-height: 1.1;
        }

        .hero-desc {
            color: var(--subtext);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .play-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            color: #000;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-btn:active {
            transform: scale(0.96);
        }

        /* GEMINI AI CONCIERGE CARD */
        .ai-hub {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 40px;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: #c084fc;
            margin-bottom: 15px;
        }

        .ai-input-row {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px 18px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .ask-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 0 24px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .ai-result {
            margin-top: 15px;
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <!-- PROFILE SELECTOR -->
    <div id="profileScreen">
        <div class="profile-title">Who's Watching?</div>
        <div class="profile-grid">
            <div class="profile-card" onclick="selectProfile('Master', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300')">
                <div class="avatar" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300');"></div>
                <div class="profile-name">Master</div>
            </div>
            <div class="profile-card" onclick="selectProfile('Guest', 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=300')">
                <div class="avatar" style="background-image: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=300');"></div>
                <div class="profile-name">Guest</div>
            </div>
        </div>
    </div>

    <!-- MAIN MEDIA CENTER -->
    <div id="mainApp">
        <div id="welcomeGreeting" class="welcome-toast">Welcome</div>

        <!-- AI Concierge -->
        <div class="ai-hub">
            <div class="ai-header">✨ Tigo AI Recommendations</div>
            <div class="ai-input-row">
                <input type="text" id="aiPrompt" placeholder="Ask AI: 'Find me sci-fi movies like Interstellar with high ratings...'">
                <button class="ask-btn" onclick="fetchAIRecommendations()">Search</button>
            </div>
            <div id="aiResponse" class="ai-result"></div>
        </div>

        <!-- Active Hero Content -->
        <div class="hero-banner">
            <div class="hero-overlay"></div>
            <div class="hero-details">
                <span class="badge">TRENDING ON TORBOX</span>
                <h1 class="hero-title">Tracker</h1>
                <div class="hero-desc">Colter Shaw travels the country in his RV helping police and private citizens solve crimes and locate missing persons until his latest case changes everything.</div>
                
                <!-- STREMIO / AIOSTREAMS DEEP-LINK -->
                <a href="stremio://detail/series/tt27812552" class="play-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Play Episode (AIOStreams)
                </a>
            </div>
        </div>
    </div>

    <script>
        // Profile Selection & Smooth Animation
        function selectProfile(name, avatarUrl) {
            const profileScreen = document.getElementById('profileScreen');
            const mainApp = document.getElementById('mainApp');
            const greeting = document.getElementById('welcomeGreeting');

            // Hide Profile Screen smoothly
            profileScreen.classList.add('hidden');

            // Display smooth welcome text
            greeting.innerText = `Welcome back, ${name}`;

            // Fade in Main App
            setTimeout(() => {
                mainApp.classList.add('visible');
            }, 300);
        }

        // Live Free Gemini AI Engine Connection
        async function fetchAIRecommendations() {
            const prompt = document.getElementById('aiPrompt').value;
            const responseDiv = document.getElementById('aiResponse');

            if(!prompt) return;
            responseDiv.innerHTML = "<i>Tigo AI is curating recommendations...</i>";

            // Put your Free Gemini API Key here (Get one free at aistudio.google.com)
            // Store key safely in browser storage instead of hardcoding in GitHub
let GEMINI_API_KEY = localStorage.getItem('AURA_GEMINI_KEY');

if (!GEMINI_API_KEY) {
    GEMINI_API_KEY = prompt("Enter your Gemini API Key once to enable AI:");
    if (GEMINI_API_KEY) {
        localStorage.setItem('AURA_GEMINI_KEY', GEMINI_API_KEY);
    }

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `You are an ultra-high-end media concierge. The user asks: "${prompt}". Give 2 succinct movie/show picks with 1-sentence descriptions and year.` }] }]
                    })
                });

                const data = await res.json();
                responseDiv.innerText = data.candidates[0].content.parts[0].text;
            } catch (err) {
                responseDiv.innerText = "Add your free Google Gemini API key to the code to activate live AI recommendations!";
            }
        }
    </script>
</body>
</html>
